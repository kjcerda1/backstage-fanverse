<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
  <title>Backstage by Fanverse</title>
  <meta name="description" content="One Universe. Endless Connections. The ultimate app for K-Pop fans." />
  <meta name="theme-color" content="#f8f2ff" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#07050f" media="(prefers-color-scheme: dark)" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <!-- NOT black-translucent. With that value iOS hands the standalone web view a
       layout viewport of screen-minus-status-bar (measured on device: 894 for a
       956 screen) but TOP-ALIGNS it at y=0, so the 62px shortfall lands at the
       BOTTOM as dead space that only paints the canvas background — anything
       positioned there (nav, DM composer) renders but is never visible, and the
       status bar simultaneously overlaps the top of the UI. With "default" the
       view is placed BELOW the status bar and its bottom sits flush with the
       screen: no dead strip, no overlap. -->
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Backstage" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" type="image/png" href="/logo-orb.png" />
  <link rel="apple-touch-icon" href="/logo-orb.png" />
  <!-- Was a CSS @import inside a React-injected <style> tag (src/lib/theme.js
       getCSS()) — that hides the font request behind JS download+execute+render
       and a second @import hop before the browser even knows the URL. A <link>
       here lets the HTML preload scanner start both requests immediately,
       in parallel with the JS bundle. Same fonts, same weights, earlier fetch. -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Epilogue:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,300;1,400;1,700;1,800&family=Instrument+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" />
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
